name: Build PrivatKomisi APK
on:
  push:
    branches:
      - build-privat-komisi-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed debug APK
        working-directory: privat-komisi-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs privat-komisi-android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging privat-komisi-android/app/build/outputs/apk/debug/app-debug.apk | head -5
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivatKomisi-v3-installable
          path: privat-komisi-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
