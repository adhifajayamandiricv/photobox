name: Build PrivatKomisi APK
on:
  push:
    branches:
      - build-privat-komisi-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: privat-komisi-android
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivatKomisi-v2-unsigned
          path: privat-komisi-android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
