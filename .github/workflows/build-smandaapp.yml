name: Build SmandaApp v1.9.1 new icon

on:
  push:
    branches:
      - smandaapp-clean-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare SmandaApp v1.9.1
        run: python scripts/prepare_smandaapp_v191.py

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SmandaApp-v1.9.1-new-icon-apk
          path: app/build/outputs/apk/debug/app-debug.apk
