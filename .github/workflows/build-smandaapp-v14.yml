name: Build SmandaApp v1.4
on:
  pull_request:
    branches: [main]

jobs:
  build-smandaapp-v14:
    if: github.head_ref == 'smandaapp-clean-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply SmandaApp v1.4 fixes
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/res/drawable
          curl -fL --retry 3 'https://sman2kuningan.sch.id/wp-content/themes/mading/images/logo.png' -o app/src/main/res/drawable/app_icon_smanda.png
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/id/sman2kuningan/smandaapp/MainActivity.java')
          s=p.read_text()
          if 'import android.webkit.WebResourceRequest;' not in s:
              s=s.replace('import android.webkit.WebViewClient;', 'import android.webkit.WebViewClient;\nimport android.webkit.WebResourceRequest;\nimport android.webkit.WebStorage;')
          if 'private boolean logoutPending = false;' not in s:
              s=s.replace('private boolean loginPending = false;', 'private boolean loginPending = false;\n    private boolean logoutPending = false;')
          s=s.replace('SmandaApp/1.2.0 SIM-SMANDA-App','SmandaApp/1.4.0 SIM-SMANDA-App')
          s=s.replace('Dibuat dan dikembangkan oleh Dadi Hardadi dan OSIS SMANDA','Dibuat dan dikembangkan oleh Dadi Hardadi & OSIS SMANDA')

          marker='''        web.setWebViewClient(new WebViewClient(){\n            @Override public void onPageFinished(WebView view,String url){'''
          replacement='''        web.setWebViewClient(new WebViewClient(){\n            @Override public boolean shouldOverrideUrlLoading(WebView view, String url){\n                return handleSpecialUrl(url);\n            }\n\n            @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request){\n                return request != null && handleSpecialUrl(request.getUrl().toString());\n            }\n\n            @Override public void onPageFinished(WebView view,String url){'''
          if marker in s and 'shouldOverrideUrlLoading(WebView view, String url)' not in s:
              s=s.replace(marker,replacement)

          old='''                if (url == null) return;\n                String low = url.toLowerCase();\n\n                if (low.startsWith(BASE.toLowerCase()) && !low.contains("login.php")) {'''
          new='''                if (url == null) return;\n                String low = url.toLowerCase();\n\n                if (logoutPending) {\n                    if (low.contains("login.php")) finishNativeLogout();\n                    return;\n                }\n\n                if (low.startsWith(BASE.toLowerCase()) && !low.contains("login.php")) {'''
          if old in s:
              s=s.replace(old,new)

          insert_before='''    private void returnToNativeLogin(){\n'''
          methods='''    private boolean handleSpecialUrl(String url){\n        if(url == null) return false;\n        if(url.toLowerCase().startsWith("smandaapp://logout")){\n            performNativeLogout();\n            return true;\n        }\n        return false;\n    }\n\n    private void performNativeLogout(){\n        if(logoutPending) return;\n        logoutPending = true;\n        loginPending = false;\n        Toast.makeText(this,"Keluar dari SmandaApp...",Toast.LENGTH_SHORT).show();\n        web.loadUrl(BASE + "modules/smandaapp/index.php?action=logout&native=1&t=" + System.currentTimeMillis());\n        handler.postDelayed(() -> { if(logoutPending) finishNativeLogout(); }, 6000);\n    }\n\n    private void finishNativeLogout(){\n        if(!logoutPending) return;\n        logoutPending = false;\n        loginPending = false;\n        CookieManager cm = CookieManager.getInstance();\n        cm.removeAllCookies(value -> {\n            cm.flush();\n            runOnUiThread(() -> {\n                try { WebStorage.getInstance().deleteAllData(); } catch(Exception ignored) {}\n                try { web.stopLoading(); } catch(Exception ignored) {}\n                try { web.clearHistory(); } catch(Exception ignored) {}\n                try { web.clearCache(true); } catch(Exception ignored) {}\n                try { web.clearFormData(); } catch(Exception ignored) {}\n                username.setText("");\n                password.setText("");\n                progress.setVisibility(View.GONE);\n                loginButton.setEnabled(true);\n                handler.postDelayed(this::recreate, 120);\n            });\n        });\n    }\n\n'''
          if insert_before in s and 'private void performNativeLogout()' not in s:
              s=s.replace(insert_before,methods+insert_before)

          bridge_marker='''        @JavascriptInterface public void loginError(final String msg){'''
          bridge='''        @JavascriptInterface public void logoutNative(){\n            runOnUiThread(() -> performNativeLogout());\n        }\n\n'''
          if bridge_marker in s and '@JavascriptInterface public void logoutNative()' not in s:
              s=s.replace(bridge_marker,bridge+bridge_marker)
          p.write_text(s)

          manifest=Path('app/src/main/AndroidManifest.xml')
          ms=manifest.read_text().replace('android:icon="@drawable/app_icon"','android:icon="@drawable/app_icon_smanda"')
          manifest.write_text(ms)

          g=Path('app/build.gradle')
          gs=g.read_text().replace('versionCode 12','versionCode 14').replace("versionName '1.2.0'","versionName '1.4.0'")
          g.write_text(gs)
          PY
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SmandaApp-v1.4.0-apk
          path: app/build/outputs/apk/debug/app-debug.apk
