name: Build SmandaApp v1.9 new server
on:
  pull_request:
    branches: [main]

jobs:
  build-smandaapp-v19:
    if: github.head_ref == 'smandaapp-clean-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply latest SmandaApp native fixes and new server
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('app/src/main/java/id/sman2kuningan/smandaapp/MainActivity.java')
          s=p.read_text()

          # Server baru.
          s=s.replace('https://simsmanda.mathpakdadi.my.id/','https://sim.sman2kuningan.my.id/')

          # Native safe-area/status-bar fix dari versi terakhir.
          if 'import android.os.Build;' not in s:
              s=s.replace('import android.os.Bundle;', 'import android.os.Bundle;\nimport android.os.Build;')
          if 'import android.webkit.WebResourceRequest;' not in s:
              s=s.replace('import android.webkit.WebViewClient;', 'import android.webkit.WebViewClient;\nimport android.webkit.WebResourceRequest;\nimport android.webkit.WebStorage;')
          if 'private boolean logoutPending = false;' not in s:
              s=s.replace('private boolean loginPending = false;', 'private boolean loginPending = false;\n    private boolean logoutPending = false;')

          s=s.replace('SmandaApp/1.2.0 SIM-SMANDA-App','SmandaApp/1.9.0 SIM-SMANDA-App')
          s=s.replace('Dibuat dan dikembangkan oleh Dadi Hardadi dan OSIS SMANDA','Dibuat dan dikembangkan oleh Dadi Hardadi & OSIS SMANDA')

          old='''        getWindow().setStatusBarColor(Color.rgb(20, 83, 202));\n        getWindow().setNavigationBarColor(Color.WHITE);\n        root = new FrameLayout(this);\n        setContentView(root);'''
          new='''        getWindow().setStatusBarColor(Color.WHITE);\n        getWindow().setNavigationBarColor(Color.WHITE);\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {\n            getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);\n        }\n        root = new FrameLayout(this);\n        setContentView(root);\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {\n            root.setOnApplyWindowInsetsListener((v, insets) -> {\n                int topInset = insets.getSystemWindowInsetTop();\n                v.setPadding(0, topInset, 0, 0);\n                return insets;\n            });\n            root.requestApplyInsets();\n        }'''
          if old in s:
              s=s.replace(old,new)

          marker='''        web.setWebViewClient(new WebViewClient(){\n            @Override public void onPageFinished(WebView view,String url){'''
          replacement='''        web.setWebViewClient(new WebViewClient(){\n            @Override public boolean shouldOverrideUrlLoading(WebView view, String url){\n                return handleSpecialUrl(url);\n            }\n            @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request){\n                return request != null && handleSpecialUrl(request.getUrl().toString());\n            }\n            @Override public void onPageFinished(WebView view,String url){'''
          if marker in s and 'shouldOverrideUrlLoading(WebView view, String url)' not in s:
              s=s.replace(marker,replacement)

          old2='''                if (url == null) return;\n                String low = url.toLowerCase();\n\n                if (low.startsWith(BASE.toLowerCase()) && !low.contains("login.php")) {'''
          new2='''                if (url == null) return;\n                String low = url.toLowerCase();\n                if (logoutPending) {\n                    if (low.contains("login.php")) finishNativeLogout();\n                    return;\n                }\n                if (low.startsWith(BASE.toLowerCase()) && !low.contains("login.php")) {'''
          if old2 in s:
              s=s.replace(old2,new2)

          insert='''    private void returnToNativeLogin(){\n'''
          methods='''    private boolean handleSpecialUrl(String url){\n        if(url == null) return false;\n        if(url.toLowerCase().startsWith("smandaapp://logout")){\n            performNativeLogout();\n            return true;\n        }\n        return false;\n    }\n\n    private void performNativeLogout(){\n        if(logoutPending) return;\n        logoutPending = true;\n        loginPending = false;\n        web.loadUrl(BASE + "modules/smandaapp/index.php?action=logout&native=1&t=" + System.currentTimeMillis());\n        handler.postDelayed(() -> { if(logoutPending) finishNativeLogout(); }, 6000);\n    }\n\n    private void finishNativeLogout(){\n        if(!logoutPending) return;\n        logoutPending = false;\n        loginPending = false;\n        CookieManager cm = CookieManager.getInstance();\n        cm.removeAllCookies(value -> {\n            cm.flush();\n            runOnUiThread(() -> {\n                try { WebStorage.getInstance().deleteAllData(); } catch(Exception ignored) {}\n                try { web.stopLoading(); } catch(Exception ignored) {}\n                try { web.clearHistory(); } catch(Exception ignored) {}\n                try { web.clearCache(true); } catch(Exception ignored) {}\n                try { web.clearFormData(); } catch(Exception ignored) {}\n                username.setText("");\n                password.setText("");\n                handler.postDelayed(this::recreate, 120);\n            });\n        });\n    }\n\n'''
          if insert in s and 'private void performNativeLogout()' not in s:
              s=s.replace(insert,methods+insert)

          bridge='''        @JavascriptInterface public void loginError(final String msg){'''
          if bridge in s and '@JavascriptInterface public void logoutNative()' not in s:
              s=s.replace(bridge,'        @JavascriptInterface public void logoutNative(){ runOnUiThread(() -> performNativeLogout()); }\n\n'+bridge)

          p.write_text(s)

          manifest=Path('app/src/main/AndroidManifest.xml')
          ms=manifest.read_text()
          ms=re.sub(r'android:icon="[^"]+"','android:icon="@drawable/app_icon_smanda_exact"',ms)
          ms=re.sub(r'\s+android:roundIcon="[^"]+"',' android:roundIcon="@drawable/app_icon_smanda_exact"',ms)
          if 'android:roundIcon=' not in ms:
              ms=ms.replace('android:icon="@drawable/app_icon_smanda_exact"','android:icon="@drawable/app_icon_smanda_exact" android:roundIcon="@drawable/app_icon_smanda_exact"')
          manifest.write_text(ms)

          g=Path('app/build.gradle')
          gs=g.read_text().replace('versionCode 12','versionCode 19').replace("versionName '1.2.0'","versionName '1.9.0'")
          g.write_text(gs)
          PY
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SmandaApp-v1.9.0-sim-sman2kuningan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
