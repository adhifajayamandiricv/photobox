plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dadi.privatkomisi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dadi.privatkomisi'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
